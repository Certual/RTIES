<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксперимент: Скорость реакции</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-teal: #45a29e;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
            --danger: #ff4c4c;
            --success: #4caf50;
            --warning: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            color: var(--accent-cyan);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-light);
            font-size: 0.9em;
        }
        .form-group input[type="text"], .form-group input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
        }
        .form-group input:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        button {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
        }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-warning { color: var(--warning); border-color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: #000; }
        .action-btn { padding: 5px 10px; font-size: 0.8em; margin: 0 2px; width: auto; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .stat-card.overall { border-color: var(--accent-teal); }
        .stat-card.danger { border-color: var(--danger); }
        .stat-value {
            font-size: 1.5em;
            color: var(--text-light);
            font-weight: bold;
        }
        .growth { font-size: 0.8em; }
        .growth.positive { color: var(--success); }
        .growth.negative { color: var(--danger); }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .history-table th, .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .history-table th { color: var(--accent-cyan); }
    </style>
</head>
<body>

<div class="container">
    <div>
        <div class="panel">
            <h2 id="formTitle">Ввод данных за День <span id="currentDayLabel">1</span></h2>
            <div class="form-group">
                <label>Formula 1 (25 результатов через пробел):</label>
                <input type="text" id="f1-results">
            </div>
            <div class="form-group">
                <label>Formula 1 - Фальшстарты:</label>
                <input type="number" id="f1-false" value="0" min="0">
            </div>
            
            <hr style="border-color:#333; margin:15px 0;">

            <div class="form-group">
                <label>Human Benchmark (5 усредненных результатов через пробел):</label>
                <input type="text" id="hb-results">
            </div>
            <div class="form-group">
                <label>Human Benchmark - Фальшстарты:</label>
                <input type="number" id="hb-false" value="0" min="0">
            </div>

            <hr style="border-color:#333; margin:15px 0;">

            <div class="checkbox-group">
                <input type="checkbox" id="osu-done">
                <label for="osu-done">Osu HRDTHD (30 мин)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="kovaaks-done">
                <label for="kovaaks-done">Kovaak's (30 мин)</label>
            </div>

            <button id="saveBtn" onclick="saveDay()">Сохранить результаты</button>
            <button id="cancelEditBtn" class="btn-warning" style="display:none;" onclick="cancelEdit()">Отменить редактирование</button>
            <button class="btn-danger" onclick="clearData()" style="margin-top: 20px;">Сбросить все данные</button>
        </div>
    </div>

    <div>
        <div class="panel">
            <h2>Статистика</h2>
            <div class="stats-grid" id="latest-stats"></div>
            
            <h2>Динамика скорости реакции</h2>
            <div class="chart-container">
                <canvas id="reactionChart"></canvas>
            </div>

            <h2>Статистика фальшстартов</h2>
            <div class="chart-container">
                <canvas id="falseStartsChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>История результатов</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>День</th>
                        <th>Общ. Ср.</th>
                        <th>Общ. Мин.</th>
                        <th>Общ. Макс.</th>
                        <th>F1 ФС</th>
                        <th>HB ФС</th>
                        <th>Osu</th>
                        <th>Kovaak's</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let experimentData = JSON.parse(localStorage.getItem('reactionExperimentData')) || [];
    let reactionChartInstance = null;
    let falseStartsChartInstance = null;
    let editIndex = -1;

    function init() {
        resetForm();
        updateDashboard();
    }

    function calculateStats(arr) {
        if (!arr || arr.length === 0) return { mean: 0, min: 0, max: 0 };
        const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
        return { 
            mean: parseFloat(mean.toFixed(2)), 
            min: Math.min(...arr), 
            max: Math.max(...arr) 
        };
    }

    function saveDay() {
        const f1Raw = document.getElementById('f1-results').value.trim();
        const hbRaw = document.getElementById('hb-results').value.trim();
        const f1Input = f1Raw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        const hbInput = hbRaw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        
        if (f1Input.length === 0 || hbInput.length === 0) {
            alert("Требуются корректные числовые значения.");
            return;
        }

        const f1False = parseInt(document.getElementById('f1-false').value) || 0;
        const hbFalse = parseInt(document.getElementById('hb-false').value) || 0;
        const osu = document.getElementById('osu-done').checked;
        const kovaaks = document.getElementById('kovaaks-done').checked;

        const f1Stats = calculateStats(f1Input);
        f1Stats.falseStarts = f1False;
        
        const hbStats = calculateStats(hbInput);
        hbStats.falseStarts = hbFalse;

        const totalMean = parseFloat(((f1Stats.mean + hbStats.mean) / 2).toFixed(2));
        const totalMin = parseFloat(((f1Stats.min + hbStats.min) / 2).toFixed(2));
        const totalMax = parseFloat(((f1Stats.max + hbStats.max) / 2).toFixed(2));

        const dayRecord = {
            f1Raw,
            hbRaw,
            f1: f1Stats,
            hb: hbStats,
            total: { mean: totalMean, min: totalMin, max: totalMax, falseStarts: f1False + hbFalse },
            osu,
            kovaaks
        };

        if (editIndex > -1) {
            dayRecord.day = experimentData[editIndex].day;
            experimentData[editIndex] = dayRecord;
        } else {
            dayRecord.day = experimentData.length + 1;
            experimentData.push(dayRecord);
        }

        saveToLocal();
        resetForm();
        updateDashboard();
    }

    function editDay(index) {
        editIndex = index;
        const data = experimentData[index];
        
        document.getElementById('f1-results').value = data.f1Raw || '';
        document.getElementById('hb-results').value = data.hbRaw || '';
        document.getElementById('f1-false').value = data.f1.falseStarts;
        document.getElementById('hb-false').value = data.hb.falseStarts;
        document.getElementById('osu-done').checked = data.osu;
        document.getElementById('kovaaks-done').checked = data.kovaaks;

        document.getElementById('formTitle').innerText = `Редактирование Дня ${data.day}`;
        document.getElementById('saveBtn').innerText = "Обновить данные";
        document.getElementById('cancelEditBtn').style.display = "block";
        window.scrollTo(0, 0);
    }

    function deleteDay(index) {
        if (confirm(`Удалить День ${experimentData[index].day}? Восстановление невозможно.`)) {
            experimentData.splice(index, 1);
            experimentData.forEach((d, i) => d.day = i + 1);
            saveToLocal();
            cancelEdit();
            updateDashboard();
        }
    }

    function cancelEdit() {
        editIndex = -1;
        resetForm();
    }

    function resetForm() {
        document.getElementById('f1-results').value = '';
        document.getElementById('hb-results').value = '';
        document.getElementById('f1-false').value = '0';
        document.getElementById('hb-false').value = '0';
        document.getElementById('osu-done').checked = false;
        document.getElementById('kovaaks-done').checked = false;
        
        document.getElementById('formTitle').innerHTML = `Ввод данных за День <span id="currentDayLabel">${experimentData.length + 1}</span>`;
        document.getElementById('saveBtn').innerText = "Сохранить результаты";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function clearData() {
        if (confirm("Полностью очистить историю?")) {
            localStorage.removeItem('reactionExperimentData');
            experimentData = [];
            init();
        }
    }

    function saveToLocal() {
        localStorage.setItem('reactionExperimentData', JSON.stringify(experimentData));
    }

    function getGrowthHTML(current, initial) {
        if (!initial) return '';
        const percent = ((current - initial) / initial) * 100;
        const isNegative = percent < 0; 
        const cls = isNegative ? 'positive' : 'negative'; 
        const sign = percent > 0 ? '+' : '';
        return `<span class="growth ${cls}">${sign}${percent.toFixed(2)}% от Дня 1</span>`;
    }

    function updateDashboard() {
        if (experimentData.length === 0) {
            document.getElementById('latest-stats').innerHTML = `
                <div class="stat-card overall">
                    <div>Общее Среднее (мс)</div>
                    <div class="stat-value">—</div>
                </div>
                <div class="stat-card">
                    <div>Общий Минимум (мс)</div>
                    <div class="stat-value">—</div>
                </div>
                <div class="stat-card danger">
                    <div>Фальшстарты (Всего)</div>
                    <div class="stat-value">0</div>
                </div>
            `;
            document.getElementById('history-body').innerHTML = '<tr><td colspan="9">Нет сохраненных данных</td></tr>';
            updateCharts();
            return;
        }
        
        const latest = experimentData[experimentData.length - 1];
        const day1 = experimentData[0];
        
        const totalF1False = experimentData.reduce((sum, d) => sum + d.f1.falseStarts, 0);
        const totalHBFalse = experimentData.reduce((sum, d) => sum + d.hb.falseStarts, 0);

        document.getElementById('latest-stats').innerHTML = `
            <div class="stat-card overall">
                <div>Общее Среднее (мс)</div>
                <div class="stat-value">${latest.total.mean}</div>
                ${getGrowthHTML(latest.total.mean, day1.total.mean)}
            </div>
            <div class="stat-card">
                <div>Общий Минимум (мс)</div>
                <div class="stat-value">${latest.total.min}</div>
                ${getGrowthHTML(latest.total.min, day1.total.min)}
            </div>
            <div class="stat-card danger">
                <div>Фальшстарты (Всего)</div>
                <div class="stat-value">${totalF1False + totalHBFalse}</div>
                <span class="growth">F1: ${totalF1False} | HB: ${totalHBFalse}</span>
            </div>
        `;

        const tbody = document.getElementById('history-body');
        tbody.innerHTML = '';
        [...experimentData].reverse().forEach((d) => {
            const actualIndex = d.day - 1;
            tbody.innerHTML += `
                <tr>
                    <td>${d.day}</td>
                    <td><strong>${d.total.mean}</strong></td>
                    <td>${d.total.min}</td>
                    <td>${d.total.max}</td>
                    <td>${d.f1.falseStarts}</td>
                    <td>${d.hb.falseStarts}</td>
                    <td>${d.osu ? '✅' : '❌'}</td>
                    <td>${d.kovaaks ? '✅' : '❌'}</td>
                    <td>
                        <button class="action-btn btn-warning" onclick="editDay(${actualIndex})">✎</button>
                        <button class="action-btn btn-danger" onclick="deleteDay(${actualIndex})">✖</button>
                    </td>
                </tr>
            `;
        });

        updateCharts();
    }

    function updateCharts() {
        const labels = experimentData.map(d => `День ${d.day}`);
        
        const ctxReaction = document.getElementById('reactionChart').getContext('2d');
        if (reactionChartInstance) reactionChartInstance.destroy();
        reactionChartInstance = new Chart(ctxReaction, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: 'Общее Среднее', data: experimentData.map(d => d.total.mean), borderColor: '#66fcf1', backgroundColor: 'rgba(102, 252, 241, 0.1)', borderWidth: 3, fill: true, tension: 0.3 },
                    { label: 'F1 Среднее', data: experimentData.map(d => d.f1.mean), borderColor: '#ff4c4c', borderWidth: 2, borderDash: [5, 5], tension: 0.3 },
                    { label: 'HB Среднее', data: experimentData.map(d => d.hb.mean), borderColor: '#4caf50', borderWidth: 2, borderDash: [5, 5], tension: 0.3 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: '#c5c6c7',
                scales: { y: { grid: { color: '#333' }, ticks: { color: '#c5c6c7' } }, x: { grid: { color: '#333' }, ticks: { color: '#c5c6c7' } } },
                plugins: { legend: { labels: { color: '#c5c6c7' } } }
            }
        });

        const ctxFalse = document.getElementById('falseStartsChart').getContext('2d');
        if (falseStartsChartInstance) falseStartsChartInstance.destroy();
        falseStartsChartInstance = new Chart(ctxFalse, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'F1 Фальшстарты', data: experimentData.map(d => d.f1.falseStarts), backgroundColor: '#ff4c4c' },
                    { label: 'HB Фальшстарты', data: experimentData.map(d => d.hb.falseStarts), backgroundColor: '#4caf50' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: '#c5c6c7',
                scales: { 
                    y: { stacked: true, grid: { color: '#333' }, ticks: { color: '#c5c6c7', stepSize: 1 } }, 
                    x: { stacked: true, grid: { color: '#333' }, ticks: { color: '#c5c6c7' } } 
                },
                plugins: { legend: { labels: { color: '#c5c6c7' } } }
            }
        });
    }

    init();
</script>
</body>
</html>
