<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксперимент: Скорость реакции</title>
    <script src="chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-teal: #45a29e;
            --text-main: #c5c6c7;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 1600px;
            height: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            overflow: hidden;
        }

        .col-left {
            overflow-y: auto;
            padding-right: 5px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-teal); }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel-auto { flex: 0 0 auto; }
        .panel-flex { flex: 1 1 auto; overflow: hidden; padding-bottom: 0; }

        h1, h2, h3 { color: var(--text-main); margin-bottom: 15px; font-weight: 600; flex-shrink: 0; }

        .form-group { margin-bottom: 15px; flex-shrink: 0; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-main); font-size: 0.9em; }
        .form-group input[type="text"], .form-group input[type="number"] {
            width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;
        }
        .form-group input:focus { border-color: var(--accent-cyan); outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--text-main); flex-shrink: 0; }

        button {
            width: 100%; padding: 12px; background: transparent; color: var(--text-main);
            border: 2px solid var(--border); border-radius: 5px; cursor: pointer;
            font-size: 1em; font-weight: bold; margin-bottom: 10px; flex-shrink: 0;
        }
        button:hover { background: var(--accent-cyan); border-color: var(--accent-cyan); color: var(--bg-color); }
        .btn-alt:hover { background: var(--accent-teal); border-color: var(--accent-teal); color: var(--bg-color); }
        .action-btn { padding: 5px 10px; font-size: 0.8em; margin: 0 2px; width: auto; }

        .theme-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: rgba(0, 0, 0, 0.15); padding: 15px; border-radius: 5px;
            border: 1px solid var(--border); margin-bottom: 15px; flex-shrink: 0;
        }
        .color-picker-group { display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
        .color-picker-group input[type="color"] { width: 40px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 15px; flex-shrink: 0;
        }
        .stat-card { background: rgba(0,0,0,0.15); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .stat-value { font-size: 1.2em; color: var(--text-main); font-weight: bold; margin: 5px 0; }
        .stat-subtext { font-size: 0.85em; opacity: 0.8; }
        .growth { font-size: 0.85em; display: block; margin-top: 5px; }
        .growth.positive { color: #4caf50; }
        .growth.negative { color: #ff4c4c; }

        .charts-row { display: flex; gap: 20px; flex-shrink: 0; }
        .chart-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .chart-col h2 { font-size: 1.1em; margin-bottom: 10px; }
        .chart-container { position: relative; height: 22vh; min-height: 180px; width: 100%; flex-shrink: 0; }

        .table-container {
            overflow-y: auto; flex: 1 1 auto;
            margin: 0 -20px; padding: 0 20px;
        }
        .history-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; }
        .history-table th, .history-table td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
        .history-table th {
            position: sticky; top: 0; background-color: var(--panel-bg);
            color: var(--text-main); z-index: 10; font-weight: 600;
            box-shadow: 0 1px 0 var(--border); border-bottom: none;
        }

        @media (max-width: 1200px) {
            body { height: auto; overflow: visible; }
            .container { grid-template-columns: 1fr; height: auto; }
            .col { height: auto; overflow: visible; }
            .charts-row { flex-direction: column; }
            .panel-flex { height: 600px; padding-bottom: 20px; }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="col col-left">
        <div class="panel panel-auto">
            <h2>Настройка цветов сайта</h2>
            <div class="theme-grid">
                <div class="color-picker-group"><label>Фон сайта:</label><input type="color" id="color-bg" value="#0b0c10" onchange="updateTheme()"></div>
                <div class="color-picker-group"><label>Фон панелей:</label><input type="color" id="color-panel" value="#1f2833" onchange="updateTheme()"></div>
                <div class="color-picker-group"><label>Акцент 1 (F1):</label><input type="color" id="color-accent1" value="#66fcf1" onchange="updateTheme()"></div>
                <div class="color-picker-group"><label>Акцент 2 (HB):</label><input type="color" id="color-accent2" value="#45a29e" onchange="updateTheme()"></div>
                <div class="color-picker-group"><label>Текст:</label><input type="color" id="color-text" value="#c5c6c7" onchange="updateTheme()"></div>
                <div class="color-picker-group"><label>Границы:</label><input type="color" id="color-border" value="#333333" onchange="updateTheme()"></div>
            </div>
            <button onclick="resetTheme()" style="margin-top: 5px;">Сбросить цвета по умолчанию</button>
        </div>

        <div class="panel panel-auto">
            <h2 id="formTitle">Ввод данных за День <span id="currentDayLabel">1</span></h2>
            <div class="form-group">
                <label>Formula 1 (25 результатов):</label>
                <input type="text" id="f1-results">
            </div>
            <div class="form-group">
                <label>Formula 1 - Фальшстарты:</label>
                <input type="number" id="f1-false" value="0" min="0">
            </div>
            
            <hr style="border-color: var(--border); margin:15px 0; flex-shrink: 0;">

            <div class="form-group">
                <label>Human Benchmark (5 усредненных):</label>
                <input type="text" id="hb-results">
            </div>
            <div class="form-group">
                <label>Human Benchmark - Фальшстарты:</label>
                <input type="number" id="hb-false" value="0" min="0">
            </div>

            <hr style="border-color: var(--border); margin:15px 0; flex-shrink: 0;">

            <div class="checkbox-group">
                <input type="checkbox" id="osu-done">
                <label for="osu-done">Osu HRDTHD (30 мин)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="kovaaks-done">
                <label for="kovaaks-done">Kovaak's (30 мин)</label>
            </div>

            <button id="saveBtn" onclick="saveDay()">Сохранить результаты</button>
            <button id="cancelEditBtn" class="btn-alt" style="display:none;" onclick="cancelEdit()">Отменить редактирование</button>
            <button onclick="clearData()" style="margin-top: 10px;">Сбросить все данные</button>
        </div>
    </div>

    <div class="col col-right">
        <div class="panel panel-auto">
            <h2>Статистика (Последний день)</h2>
            <div class="stats-grid" id="latest-stats"></div>
            
            <div class="charts-row">
                <div class="chart-col">
                    <h2>Динамика показателей</h2>
                    <div class="chart-container"><canvas id="reactionChart"></canvas></div>
                </div>
                <div class="chart-col">
                    <h2>Фальшстарты</h2>
                    <div class="chart-container"><canvas id="falseStartsChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="panel panel-flex">
            <h2>История результатов</h2>
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Общее (Ср / Мин / Макс)</th>
                            <th>F1 (Ср / Мин / Макс)</th>
                            <th>HB (Ср / Мин / Макс)</th>
                            <th>ФС (F1/HB)</th>
                            <th>Osu / Kovaak's</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultTheme = {
        bg: '#0b0c10',
        panel: '#1f2833',
        acc1: '#66fcf1',
        acc2: '#45a29e',
        text: '#c5c6c7',
        border: '#333333'
    };

    let experimentData = JSON.parse(localStorage.getItem('reactionExperimentData')) || [];
    let customTheme = JSON.parse(localStorage.getItem('reactionCustomTheme')) || defaultTheme;
    
    let reactionChartInstance = null;
    let falseStartsChartInstance = null;
    let editIndex = -1;

    function init() {
        loadThemeInputs();
        applyThemeCSS();
        resetForm();
        updateDashboard();
    }

    function loadThemeInputs() {
        document.getElementById('color-bg').value = customTheme.bg;
        document.getElementById('color-panel').value = customTheme.panel;
        document.getElementById('color-accent1').value = customTheme.acc1;
        document.getElementById('color-accent2').value = customTheme.acc2;
        document.getElementById('color-text').value = customTheme.text;
        document.getElementById('color-border').value = customTheme.border;
    }

    function updateTheme() {
        customTheme = {
            bg: document.getElementById('color-bg').value,
            panel: document.getElementById('color-panel').value,
            acc1: document.getElementById('color-accent1').value,
            acc2: document.getElementById('color-accent2').value,
            text: document.getElementById('color-text').value,
            border: document.getElementById('color-border').value
        };
        localStorage.setItem('reactionCustomTheme', JSON.stringify(customTheme));
        applyThemeCSS();
    }

    function resetTheme() {
        customTheme = { ...defaultTheme };
        localStorage.setItem('reactionCustomTheme', JSON.stringify(customTheme));
        loadThemeInputs();
        applyThemeCSS();
    }

    function applyThemeCSS() {
        document.documentElement.style.setProperty('--bg-color', customTheme.bg);
        document.documentElement.style.setProperty('--panel-bg', customTheme.panel);
        document.documentElement.style.setProperty('--accent-cyan', customTheme.acc1);
        document.documentElement.style.setProperty('--accent-teal', customTheme.acc2);
        document.documentElement.style.setProperty('--text-main', customTheme.text);
        document.documentElement.style.setProperty('--border', customTheme.border);
        updateCharts();
    }

    function calculateStats(arr) {
        if (!arr || arr.length === 0) return { mean: 0, min: 0, max: 0 };
        return { 
            mean: parseFloat((arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(2)), 
            min: Math.min(...arr), 
            max: Math.max(...arr) 
        };
    }

    function saveDay() {
        const f1Raw = document.getElementById('f1-results').value.trim();
        const hbRaw = document.getElementById('hb-results').value.trim();
        const f1Input = f1Raw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        const hbInput = hbRaw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        
        if (f1Input.length === 0 || hbInput.length === 0) {
            alert("Требуются корректные числовые значения.");
            return;
        }

        const f1Stats = calculateStats(f1Input);
        f1Stats.falseStarts = parseInt(document.getElementById('f1-false').value) || 0;
        
        const hbStats = calculateStats(hbInput);
        hbStats.falseStarts = parseInt(document.getElementById('hb-false').value) || 0;

        const dayRecord = {
            f1Raw, hbRaw, f1: f1Stats, hb: hbStats,
            total: { 
                mean: parseFloat(((f1Stats.mean + hbStats.mean) / 2).toFixed(2)), 
                min: parseFloat(((f1Stats.min + hbStats.min) / 2).toFixed(2)), 
                max: parseFloat(((f1Stats.max + hbStats.max) / 2).toFixed(2))
            },
            osu: document.getElementById('osu-done').checked,
            kovaaks: document.getElementById('kovaaks-done').checked
        };

        if (editIndex > -1) {
            dayRecord.day = experimentData[editIndex].day;
            experimentData[editIndex] = dayRecord;
        } else {
            dayRecord.day = experimentData.length + 1;
            experimentData.push(dayRecord);
        }

        localStorage.setItem('reactionExperimentData', JSON.stringify(experimentData));
        resetForm();
        updateDashboard();
    }

    function editDay(index) {
        editIndex = index;
        const data = experimentData[index];
        document.getElementById('f1-results').value = data.f1Raw || '';
        document.getElementById('hb-results').value = data.hbRaw || '';
        document.getElementById('f1-false').value = data.f1.falseStarts;
        document.getElementById('hb-false').value = data.hb.falseStarts;
        document.getElementById('osu-done').checked = data.osu;
        document.getElementById('kovaaks-done').checked = data.kovaaks;
        document.getElementById('formTitle').innerText = `Редактирование Дня ${data.day}`;
        document.getElementById('saveBtn').innerText = "Обновить данные";
        document.getElementById('cancelEditBtn').style.display = "block";
    }

    function deleteDay(index) {
        if (confirm(`Удалить День ${experimentData[index].day}?`)) {
            experimentData.splice(index, 1);
            experimentData.forEach((d, i) => d.day = i + 1);
            localStorage.setItem('reactionExperimentData', JSON.stringify(experimentData));
            cancelEdit();
            updateDashboard();
        }
    }

    function cancelEdit() {
        editIndex = -1;
        resetForm();
    }

    function resetForm() {
        document.getElementById('f1-results').value = '';
        document.getElementById('hb-results').value = '';
        document.getElementById('f1-false').value = '0';
        document.getElementById('hb-false').value = '0';
        document.getElementById('osu-done').checked = false;
        document.getElementById('kovaaks-done').checked = false;
        document.getElementById('formTitle').innerHTML = `Ввод данных за День <span id="currentDayLabel">${experimentData.length + 1}</span>`;
        document.getElementById('saveBtn').innerText = "Сохранить результаты";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function clearData() {
        if (confirm("Полностью очистить историю?")) {
            localStorage.removeItem('reactionExperimentData');
            experimentData = [];
            init();
        }
    }

    function getGrowthHTML(current, initial) {
        if (!initial) return '';
        const percent = ((current - initial) / initial) * 100;
        const cls = percent <= 0 ? 'positive' : 'negative'; 
        return `<span class="growth ${cls}">${percent > 0 ? '+' : ''}${percent.toFixed(2)}% от Дня 1</span>`;
    }

    function updateDashboard() {
        const statsEl = document.getElementById('latest-stats');
        const tbody = document.getElementById('history-body');

        if (experimentData.length === 0) {
            statsEl.innerHTML = '<p>Нет сохраненных данных</p>';
            tbody.innerHTML = '<tr><td colspan="7">Нет сохраненных данных</td></tr>';
            updateCharts();
            return;
        }
        
        const latest = experimentData[experimentData.length - 1];
        const day1 = experimentData[0];
        const totalF1FS = experimentData.reduce((sum, d) => sum + d.f1.falseStarts, 0);
        const totalHBFS = experimentData.reduce((sum, d) => sum + d.hb.falseStarts, 0);

        statsEl.innerHTML = `
            <div class="stat-card">
                <div>Общие показатели</div>
                <div class="stat-value">Ср: ${latest.total.mean}</div>
                <div class="stat-subtext">Мин: ${latest.total.min} | Макс: ${latest.total.max}</div>
                ${getGrowthHTML(latest.total.mean, day1.total.mean)}
            </div>
            <div class="stat-card">
                <div>Formula 1</div>
                <div class="stat-value">Ср: ${latest.f1.mean}</div>
                <div class="stat-subtext">Мин: ${latest.f1.min} | Макс: ${latest.f1.max}</div>
                ${getGrowthHTML(latest.f1.mean, day1.f1.mean)}
            </div>
            <div class="stat-card">
                <div>Human Benchmark</div>
                <div class="stat-value">Ср: ${latest.hb.mean}</div>
                <div class="stat-subtext">Мин: ${latest.hb.min} | Макс: ${latest.hb.max}</div>
                ${getGrowthHTML(latest.hb.mean, day1.hb.mean)}
            </div>
            <div class="stat-card">
                <div>Фальшстарты (Всего)</div>
                <div class="stat-value">${totalF1FS + totalHBFS}</div>
                <div class="stat-subtext">F1: ${totalF1FS} | HB: ${totalHBFS}</div>
            </div>
        `;

        tbody.innerHTML = '';
        [...experimentData].reverse().forEach((d) => {
            const index = d.day - 1;
            tbody.innerHTML += `
                <tr>
                    <td>${d.day}</td>
                    <td><strong>${d.total.mean}</strong> / ${d.total.min} / ${d.total.max}</td>
                    <td>${d.f1.mean} / ${d.f1.min} / ${d.f1.max}</td>
                    <td>${d.hb.mean} / ${d.hb.min} / ${d.hb.max}</td>
                    <td>${d.f1.falseStarts} / ${d.hb.falseStarts}</td>
                    <td>${d.osu ? '✅' : '❌'} / ${d.kovaaks ? '✅' : '❌'}</td>
                    <td>
                        <button class="action-btn btn-alt" onclick="editDay(${index})">✎</button>
                        <button class="action-btn" onclick="deleteDay(${index})">✖</button>
                    </td>
                </tr>
            `;
        });

        updateCharts();
    }

    function updateCharts() {
        if (experimentData.length === 0) return;

        const style = getComputedStyle(document.documentElement);
        const cText = style.getPropertyValue('--text-main').trim();
        const cAcc1 = style.getPropertyValue('--accent-cyan').trim();
        const cAcc2 = style.getPropertyValue('--accent-teal').trim();
        const cGrid = style.getPropertyValue('--border').trim();

        const labels = experimentData.map(d => `Д${d.day}`);
        
        const ctxReaction = document.getElementById('reactionChart').getContext('2d');
        if (reactionChartInstance) reactionChartInstance.destroy();
        reactionChartInstance = new Chart(ctxReaction, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: 'Общее Среднее', data: experimentData.map(d => d.total.mean), borderColor: cText, backgroundColor: cText+'33', borderWidth: 3, fill: true, tension: 0.3 },
                    { label: 'F1 Среднее', data: experimentData.map(d => d.f1.mean), borderColor: cAcc1, borderWidth: 2, borderDash: [5, 5], tension: 0.3 },
                    { label: 'HB Среднее', data: experimentData.map(d => d.hb.mean), borderColor: cAcc2, borderWidth: 2, borderDash: [5, 5], tension: 0.3 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: cText,
                scales: { y: { grid: { color: cGrid }, ticks: { color: cText } }, x: { grid: { color: cGrid }, ticks: { color: cText } } },
                plugins: { legend: { labels: { color: cText } } }
            }
        });

        const ctxFalse = document.getElementById('falseStartsChart').getContext('2d');
        if (falseStartsChartInstance) falseStartsChartInstance.destroy();
        falseStartsChartInstance = new Chart(ctxFalse, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'F1 ФС', data: experimentData.map(d => d.f1.falseStarts), backgroundColor: cAcc1 },
                    { label: 'HB ФС', data: experimentData.map(d => d.hb.falseStarts), backgroundColor: cAcc2 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: cText,
                scales: { 
                    y: { stacked: true, grid: { color: cGrid }, ticks: { color: cText, stepSize: 1 } }, 
                    x: { stacked: true, grid: { color: cGrid }, ticks: { color: cText } } 
                },
                plugins: { legend: { labels: { color: cText } } }
            }
        });
    }

    init();
</script>
</body>
</html>
