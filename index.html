<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксперимент: Скорость реакции</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-teal: #45a29e;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
            --danger: #ff4c4c;
            --success: #4caf50;
            --warning: #f1c40f;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        h1, h2, h3 {
            color: var(--accent-cyan);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-light);
            font-size: 0.9em;
        }
        .form-group input[type="text"], .form-group input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: var(--text-light);
            border-radius: 5px;
        }
        .form-group input:focus, select:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        button {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
        }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-warning { color: var(--warning); border-color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: #000; }
        .action-btn { padding: 5px 10px; font-size: 0.8em; margin: 0 2px; width: auto; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0,0,0,0.15);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .stat-card.overall { border-color: var(--accent-teal); }
        .stat-value {
            font-size: 1.2em;
            color: var(--text-light);
            font-weight: bold;
            margin: 5px 0;
        }
        .stat-subtext { font-size: 0.85em; opacity: 0.8; }
        .growth { font-size: 0.85em; display: block; margin-top: 5px; }
        .growth.positive { color: var(--success); }
        .growth.negative { color: var(--danger); }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .history-table th, .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .history-table th { color: var(--accent-cyan); }

        #customThemeSettings {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }
        .color-picker-group { display: flex; justify-content: space-between; align-items: center; }
        .color-picker-group input[type="color"] { width: 40px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div>
        <div class="panel">
            <h2>Настройки темы</h2>
            <select id="themeSelect" onchange="applyTheme()">
                <option value="default">Default Dark</option>
                <option value="materialDark">Material Dark</option>
                <option value="materialLight">Material Light</option>
                <option value="fluentDark">Fluent Dark</option>
                <option value="fluentLight">Fluent Light</option>
                <option value="dracula">Dracula</option>
                <option value="nord">Nord</option>
                <option value="solarized">Solarized Dark</option>
                <option value="cyberpunk">Cyberpunk</option>
                <option value="monokai">Monokai</option>
                <option value="custom">Пользовательская</option>
            </select>

            <div id="customThemeSettings">
                <div class="color-picker-group"><label>Фон:</label><input type="color" id="color-bg" onchange="updateCustomTheme()"></div>
                <div class="color-picker-group"><label>Панели:</label><input type="color" id="color-panel" onchange="updateCustomTheme()"></div>
                <div class="color-picker-group"><label>Акцент 1:</label><input type="color" id="color-accent1" onchange="updateCustomTheme()"></div>
                <div class="color-picker-group"><label>Акцент 2:</label><input type="color" id="color-accent2" onchange="updateCustomTheme()"></div>
                <div class="color-picker-group"><label>Текст:</label><input type="color" id="color-text" onchange="updateCustomTheme()"></div>
                <div class="color-picker-group"><label>Границы:</label><input type="color" id="color-border" onchange="updateCustomTheme()"></div>
            </div>
        </div>

        <div class="panel">
            <h2 id="formTitle">Ввод данных за День <span id="currentDayLabel">1</span></h2>
            <div class="form-group">
                <label>Formula 1 (25 результатов):</label>
                <input type="text" id="f1-results">
            </div>
            <div class="form-group">
                <label>Formula 1 - Фальшстарты:</label>
                <input type="number" id="f1-false" value="0" min="0">
            </div>
            
            <hr style="border-color: var(--border); margin:15px 0;">

            <div class="form-group">
                <label>Human Benchmark (5 усредненных):</label>
                <input type="text" id="hb-results">
            </div>
            <div class="form-group">
                <label>Human Benchmark - Фальшстарты:</label>
                <input type="number" id="hb-false" value="0" min="0">
            </div>

            <hr style="border-color: var(--border); margin:15px 0;">

            <div class="checkbox-group">
                <input type="checkbox" id="osu-done">
                <label for="osu-done">Osu HRDTHD (30 мин)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="kovaaks-done">
                <label for="kovaaks-done">Kovaak's (30 мин)</label>
            </div>

            <button id="saveBtn" onclick="saveDay()">Сохранить результаты</button>
            <button id="cancelEditBtn" class="btn-warning" style="display:none;" onclick="cancelEdit()">Отменить редактирование</button>
            <button class="btn-danger" onclick="clearData()" style="margin-top: 20px;">Сбросить все данные</button>
        </div>
    </div>

    <div>
        <div class="panel">
            <h2>Статистика (Последний день)</h2>
            <div class="stats-grid" id="latest-stats"></div>
            
            <h2>Динамика показателей</h2>
            <div class="chart-container"><canvas id="reactionChart"></canvas></div>
            
            <h2>Фальшстарты</h2>
            <div class="chart-container"><canvas id="falseStartsChart"></canvas></div>
        </div>

        <div class="panel" style="overflow-x: auto;">
            <h2>История результатов</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>День</th>
                        <th>Общее (Ср / Мин / Макс)</th>
                        <th>F1 (Ср / Мин / Макс)</th>
                        <th>HB (Ср / Мин / Макс)</th>
                        <th>ФС (F1/HB)</th>
                        <th>Osu / Kovaak's</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const themes = {
        default: { bg: '#0b0c10', panel: '#1f2833', acc1: '#66fcf1', acc2: '#45a29e', text: '#c5c6c7', textL: '#ffffff', border: '#333333' },
        materialDark: { bg: '#121212', panel: '#1e1e1e', acc1: '#bb86fc', acc2: '#03dac6', text: '#e0e0e0', textL: '#ffffff', border: '#333333' },
        materialLight: { bg: '#fafafa', panel: '#ffffff', acc1: '#6200ee', acc2: '#03dac6', text: '#333333', textL: '#000000', border: '#e0e0e0' },
        fluentDark: { bg: '#202020', panel: '#2b2b2b', acc1: '#60cdff', acc2: '#0078d4', text: '#cccccc', textL: '#ffffff', border: '#454545' },
        fluentLight: { bg: '#f3f3f3', panel: '#ffffff', acc1: '#0078d4', acc2: '#005a9e', text: '#333333', textL: '#000000', border: '#e5e5e5' },
        dracula: { bg: '#282a36', panel: '#44475a', acc1: '#ff79c6', acc2: '#bd93f9', text: '#f8f8f2', textL: '#ffffff', border: '#6272a4' },
        nord: { bg: '#2e3440', panel: '#3b4252', acc1: '#88c0d0', acc2: '#8fbcbb', text: '#d8dee9', textL: '#eceff4', border: '#4c566a' },
        solarized: { bg: '#002b36', panel: '#073642', acc1: '#2aa198', acc2: '#268bd2', text: '#93a1a1', textL: '#eee8d5', border: '#586e75' },
        cyberpunk: { bg: '#fcee0a', panel: '#000000', acc1: '#00ff00', acc2: '#ff003c', text: '#ffffff', textL: '#fcee0a', border: '#ff003c' },
        monokai: { bg: '#272822', panel: '#3e3d32', acc1: '#f92672', acc2: '#a6e22e', text: '#f8f8f2', textL: '#ffffff', border: '#75715e' }
    };

    let experimentData = JSON.parse(localStorage.getItem('reactionExperimentData')) || [];
    let currentThemeConfig = JSON.parse(localStorage.getItem('reactionThemeConfig')) || { name: 'default', custom: themes.default };
    
    let reactionChartInstance = null;
    let falseStartsChartInstance = null;
    let editIndex = -1;

    function init() {
        document.getElementById('themeSelect').value = currentThemeConfig.name;
        applyTheme(true);
        resetForm();
        updateDashboard();
    }

    function applyTheme(isInit = false) {
        const select = document.getElementById('themeSelect');
        const customSettings = document.getElementById('customThemeSettings');
        const name = select.value;
        
        let colors;
        if (name === 'custom') {
            customSettings.style.display = 'grid';
            colors = currentThemeConfig.custom;
            if (isInit) {
                document.getElementById('color-bg').value = colors.bg;
                document.getElementById('color-panel').value = colors.panel;
                document.getElementById('color-accent1').value = colors.acc1;
                document.getElementById('color-accent2').value = colors.acc2;
                document.getElementById('color-text').value = colors.text;
                document.getElementById('color-border').value = colors.border;
            }
        } else {
            customSettings.style.display = 'none';
            colors = themes[name];
        }

        document.documentElement.style.setProperty('--bg-color', colors.bg);
        document.documentElement.style.setProperty('--panel-bg', colors.panel);
        document.documentElement.style.setProperty('--accent-cyan', colors.acc1);
        document.documentElement.style.setProperty('--accent-teal', colors.acc2);
        document.documentElement.style.setProperty('--text-main', colors.text);
        document.documentElement.style.setProperty('--text-light', colors.textL || colors.text);
        document.documentElement.style.setProperty('--border', colors.border);

        currentThemeConfig.name = name;
        if (name !== 'custom') currentThemeConfig.custom = colors;
        localStorage.setItem('reactionThemeConfig', JSON.stringify(currentThemeConfig));

        updateCharts();
    }

    function updateCustomTheme() {
        currentThemeConfig.custom = {
            bg: document.getElementById('color-bg').value,
            panel: document.getElementById('color-panel').value,
            acc1: document.getElementById('color-accent1').value,
            acc2: document.getElementById('color-accent2').value,
            text: document.getElementById('color-text').value,
            textL: document.getElementById('color-text').value,
            border: document.getElementById('color-border').value
        };
        applyTheme();
    }

    function calculateStats(arr) {
        if (!arr || arr.length === 0) return { mean: 0, min: 0, max: 0 };
        return { 
            mean: parseFloat((arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(2)), 
            min: Math.min(...arr), 
            max: Math.max(...arr) 
        };
    }

    function saveDay() {
        const f1Raw = document.getElementById('f1-results').value.trim();
        const hbRaw = document.getElementById('hb-results').value.trim();
        const f1Input = f1Raw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        const hbInput = hbRaw.split(/\s+/).map(Number).filter(n => !isNaN(n) && n > 0);
        
        if (f1Input.length === 0 || hbInput.length === 0) {
            alert("Требуются корректные числовые значения.");
            return;
        }

        const f1Stats = calculateStats(f1Input);
        f1Stats.falseStarts = parseInt(document.getElementById('f1-false').value) || 0;
        
        const hbStats = calculateStats(hbInput);
        hbStats.falseStarts = parseInt(document.getElementById('hb-false').value) || 0;

        const dayRecord = {
            f1Raw, hbRaw, f1: f1Stats, hb: hbStats,
            total: { 
                mean: parseFloat(((f1Stats.mean + hbStats.mean) / 2).toFixed(2)), 
                min: parseFloat(((f1Stats.min + hbStats.min) / 2).toFixed(2)), 
                max: parseFloat(((f1Stats.max + hbStats.max) / 2).toFixed(2))
            },
            osu: document.getElementById('osu-done').checked,
            kovaaks: document.getElementById('kovaaks-done').checked
        };

        if (editIndex > -1) {
            dayRecord.day = experimentData[editIndex].day;
            experimentData[editIndex] = dayRecord;
        } else {
            dayRecord.day = experimentData.length + 1;
            experimentData.push(dayRecord);
        }

        localStorage.setItem('reactionExperimentData', JSON.stringify(experimentData));
        resetForm();
        updateDashboard();
    }

    function editDay(index) {
        editIndex = index;
        const data = experimentData[index];
        document.getElementById('f1-results').value = data.f1Raw || '';
        document.getElementById('hb-results').value = data.hbRaw || '';
        document.getElementById('f1-false').value = data.f1.falseStarts;
        document.getElementById('hb-false').value = data.hb.falseStarts;
        document.getElementById('osu-done').checked = data.osu;
        document.getElementById('kovaaks-done').checked = data.kovaaks;
        document.getElementById('formTitle').innerText = `Редактирование Дня ${data.day}`;
        document.getElementById('saveBtn').innerText = "Обновить данные";
        document.getElementById('cancelEditBtn').style.display = "block";
        window.scrollTo(0, 0);
    }

    function deleteDay(index) {
        if (confirm(`Удалить День ${experimentData[index].day}?`)) {
            experimentData.splice(index, 1);
            experimentData.forEach((d, i) => d.day = i + 1);
            localStorage.setItem('reactionExperimentData', JSON.stringify(experimentData));
            cancelEdit();
            updateDashboard();
        }
    }

    function cancelEdit() {
        editIndex = -1;
        resetForm();
    }

    function resetForm() {
        document.getElementById('f1-results').value = '';
        document.getElementById('hb-results').value = '';
        document.getElementById('f1-false').value = '0';
        document.getElementById('hb-false').value = '0';
        document.getElementById('osu-done').checked = false;
        document.getElementById('kovaaks-done').checked = false;
        document.getElementById('formTitle').innerHTML = `Ввод данных за День <span id="currentDayLabel">${experimentData.length + 1}</span>`;
        document.getElementById('saveBtn').innerText = "Сохранить результаты";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function clearData() {
        if (confirm("Полностью очистить историю?")) {
            localStorage.removeItem('reactionExperimentData');
            experimentData = [];
            init();
        }
    }

    function getGrowthHTML(current, initial) {
        if (!initial) return '';
        const percent = ((current - initial) / initial) * 100;
        const cls = percent <= 0 ? 'positive' : 'negative'; 
        return `<span class="growth ${cls}">${percent > 0 ? '+' : ''}${percent.toFixed(2)}% от Дня 1</span>`;
    }

    function updateDashboard() {
        const statsEl = document.getElementById('latest-stats');
        const tbody = document.getElementById('history-body');

        if (experimentData.length === 0) {
            statsEl.innerHTML = '<p>Нет данных</p>';
            tbody.innerHTML = '<tr><td colspan="7">Нет сохраненных данных</td></tr>';
            updateCharts();
            return;
        }
        
        const latest = experimentData[experimentData.length - 1];
        const day1 = experimentData[0];
        const totalF1FS = experimentData.reduce((sum, d) => sum + d.f1.falseStarts, 0);
        const totalHBFS = experimentData.reduce((sum, d) => sum + d.hb.falseStarts, 0);

        statsEl.innerHTML = `
            <div class="stat-card overall">
                <div>Общие показатели</div>
                <div class="stat-value">Ср: ${latest.total.mean}</div>
                <div class="stat-subtext">Мин: ${latest.total.min} | Макс: ${latest.total.max}</div>
                ${getGrowthHTML(latest.total.mean, day1.total.mean)}
            </div>
            <div class="stat-card">
                <div>Formula 1</div>
                <div class="stat-value">Ср: ${latest.f1.mean}</div>
                <div class="stat-subtext">Мин: ${latest.f1.min} | Макс: ${latest.f1.max}</div>
                ${getGrowthHTML(latest.f1.mean, day1.f1.mean)}
            </div>
            <div class="stat-card">
                <div>Human Benchmark</div>
                <div class="stat-value">Ср: ${latest.hb.mean}</div>
                <div class="stat-subtext">Мин: ${latest.hb.min} | Макс: ${latest.hb.max}</div>
                ${getGrowthHTML(latest.hb.mean, day1.hb.mean)}
            </div>
            <div class="stat-card" style="border-color: var(--danger)">
                <div>Фальшстарты (Всего)</div>
                <div class="stat-value">${totalF1FS + totalHBFS}</div>
                <div class="stat-subtext">F1: ${totalF1FS} | HB: ${totalHBFS}</div>
            </div>
        `;

        tbody.innerHTML = '';
        [...experimentData].reverse().forEach((d) => {
            const index = d.day - 1;
            tbody.innerHTML += `
                <tr>
                    <td>${d.day}</td>
                    <td><strong>${d.total.mean}</strong> / ${d.total.min} / ${d.total.max}</td>
                    <td>${d.f1.mean} / ${d.f1.min} / ${d.f1.max}</td>
                    <td>${d.hb.mean} / ${d.hb.min} / ${d.hb.max}</td>
                    <td>${d.f1.falseStarts} / ${d.hb.falseStarts}</td>
                    <td>${d.osu ? '✅' : '❌'} / ${d.kovaaks ? '✅' : '❌'}</td>
                    <td>
                        <button class="action-btn btn-warning" onclick="editDay(${index})">✎</button>
                        <button class="action-btn btn-danger" onclick="deleteDay(${index})">✖</button>
                    </td>
                </tr>
            `;
        });

        updateCharts();
    }

    function updateCharts() {
        if (experimentData.length === 0) return;

        const style = getComputedStyle(document.documentElement);
        const cText = style.getPropertyValue('--text-main').trim();
        const cAcc1 = style.getPropertyValue('--accent-cyan').trim();
        const cGrid = style.getPropertyValue('--border').trim();

        const labels = experimentData.map(d => `Д${d.day}`);
        
        const ctxReaction = document.getElementById('reactionChart').getContext('2d');
        if (reactionChartInstance) reactionChartInstance.destroy();
        reactionChartInstance = new Chart(ctxReaction, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: 'Общее Среднее', data: experimentData.map(d => d.total.mean), borderColor: cAcc1, backgroundColor: cAcc1+'33', borderWidth: 3, fill: true, tension: 0.3 },
                    { label: 'F1 Среднее', data: experimentData.map(d => d.f1.mean), borderColor: '#ff4c4c', borderWidth: 2, borderDash: [5, 5], tension: 0.3 },
                    { label: 'HB Среднее', data: experimentData.map(d => d.hb.mean), borderColor: '#4caf50', borderWidth: 2, borderDash: [5, 5], tension: 0.3 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: cText,
                scales: { y: { grid: { color: cGrid }, ticks: { color: cText } }, x: { grid: { color: cGrid }, ticks: { color: cText } } },
                plugins: { legend: { labels: { color: cText } } }
            }
        });

        const ctxFalse = document.getElementById('falseStartsChart').getContext('2d');
        if (falseStartsChartInstance) falseStartsChartInstance.destroy();
        falseStartsChartInstance = new Chart(ctxFalse, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'F1 ФС', data: experimentData.map(d => d.f1.falseStarts), backgroundColor: '#ff4c4c' },
                    { label: 'HB ФС', data: experimentData.map(d => d.hb.falseStarts), backgroundColor: '#4caf50' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, color: cText,
                scales: { 
                    y: { stacked: true, grid: { color: cGrid }, ticks: { color: cText, stepSize: 1 } }, 
                    x: { stacked: true, grid: { color: cGrid }, ticks: { color: cText } } 
                },
                plugins: { legend: { labels: { color: cText } } }
            }
        });
    }

    init();
</script>
</body>
</html>
